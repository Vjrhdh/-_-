<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Retro Racer 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080914;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:12px;font-weight:900}
.box{background:rgba(8,10,25,.7);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
#speed{font-size:22px;color:#7df9ff}#lap{font-size:16px}
#message{position:absolute;top:43%;width:100%;text-align:center;font-size:38px;font-weight:1000;letter-spacing:2px;opacity:0}
#touch{position:fixed;left:0;right:0;bottom:15px;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.pad{display:flex;gap:12px;pointer-events:auto}.btn{width:70px;height:70px;border-radius:18px;border:2px solid #ffffff55;background:#10152acc;color:#fff;font-size:30px;font-weight:bold;touch-action:none;user-select:none}
#nitro{width:92px;font-size:16px;background:#25205ccc}
#menu{position:fixed;inset:0;background:linear-gradient(#090b1ddd,#17112ddd);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{width:min(92vw,520px);padding:28px;border:3px solid #ff3b9d;border-radius:20px;background:#0c1020ee;box-shadow:0 0 50px #ff3b9d33;text-align:center}
h1{margin:0 0 6px;font-size:48px;letter-spacing:3px;color:#7df9ff;text-shadow:4px 4px #ff3b9d}
p{color:#cfd5e8}.menuBtn{width:100%;margin:8px 0;padding:15px;border:0;border-radius:12px;background:#ff3b9d;color:#fff;font-weight:900;font-size:18px}.menuBtn.alt{background:#252c4a}
#help{font-size:13px;color:#9ba4c6;line-height:1.5}
@media(min-width:800px){#touch{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top"><div class="box">RETRO RACER <span id="lap">КРУГ 1/3</span></div><div class="box" id="speed">0 KM/H</div></div>
  <div id="message"></div>
</div>
<div id="touch">
  <div class="pad"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div>
  <div class="pad"><button class="btn" id="nitro">NITRO</button><button class="btn" id="brake">▼</button></div>
</div>
<div id="menu">
  <div class="panel">
    <h1>RETRO RACER</h1>
    <p>Аркадные 3D-гонки в стиле неоновых 80-х.</p>
    <button class="menuBtn" id="start">СТАРТ</button>
    <button class="menuBtn alt" id="reset">СБРОСИТЬ РЕКОРД</button>
    <div id="help">ПК: W/S — газ/тормоз, A/D — руль, Shift — нитро.<br>Телефон: кнопки снизу. Камера автоматически следует за машиной.</div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070817);
scene.fog = new THREE.Fog(0x070817, 70, 260);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, .1, 500);
camera.position.set(0,7,12);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8b9dff,0x18111f,1.8));
const sun = new THREE.DirectionalLight(0xffd8a8,2.2);
sun.position.set(-30,45,25); sun.castShadow=true; scene.add(sun);

const mat = (c,em=0) => new THREE.MeshStandardMaterial({color:c,roughness:.75,emissive:em});
const roadMat=mat(0x29283a), grassMat=mat(0x101d18), lineMat=mat(0xf5e7bd), neonPink=mat(0xff238f,0x66103a), neonCyan=mat(0x18e8ff,0x063b44);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(500,500),grassMat);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// Track: long rounded rectangle made from segments
const trackGroup=new THREE.Group(); scene.add(trackGroup);
const W=14, L=190;
const road=new THREE.Mesh(new THREE.BoxGeometry(W,.18,L),roadMat);
road.position.y=.05; road.receiveShadow=true; trackGroup.add(road);

for(let z=-L/2+4;z<L/2;z+=8){
  for(const x of [-W/2-.35,W/2+.35]){
    const curb=new THREE.Mesh(new THREE.BoxGeometry(.45,.22,7), ((Math.round((z+L/2)/8)%2)?neonCyan:neonPink));
    curb.position.set(x,.16,z); trackGroup.add(curb);
  }
}
for(let z=-L/2;z<L/2;z+=6){
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(.22,.025,2.5),lineMat);
  stripe.position.set(0,.16,z); trackGroup.add(stripe);
}

// mountains / skyline
for(let i=0;i<45;i++){
  const h=5+Math.random()*24, w=4+Math.random()*10;
  const m=new THREE.Mesh(new THREE.ConeGeometry(w,h,4),mat(i%2?0x18234b:0x261a42));
  m.position.set((Math.random()<.5?-1:1)*(18+Math.random()*45),h/2,(Math.random()-.5)*L);
  scene.add(m);
}
for(let z=-L/2;z<L/2;z+=14){
  for(const x of [-11,11]){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,5,8),neonCyan);
    pole.position.set(x,2.5,z); scene.add(pole);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.28,10,10),neonPink);
    lamp.position.set(x,5,z); scene.add(lamp);
  }
}

// Car
const car=new THREE.Group(); scene.add(car);
const body=new THREE.Mesh(new THREE.BoxGeometry(2.5,.65,4.2),mat(0xe92d63,0x3d0717)); body.position.y=.72; body.castShadow=true; car.add(body);
const hood=new THREE.Mesh(new THREE.BoxGeometry(2.2,.3,1.4),mat(0xff4b72,0x25050d)); hood.position.set(0,1.08,-1.15); hood.castShadow=true; car.add(hood);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.75,.72,1.7),mat(0x263b66,0x091122)); cabin.position.set(0,1.3,.45); cabin.castShadow=true; car.add(cabin);
const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.55,.25,.25),neonCyan); bumper.position.set(0,.58,-2.12); car.add(bumper);
for(const x of [-1.18,1.18]) for(const z of [-1.35,1.35]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.32,16),mat(0x101018));
  wheel.rotation.z=Math.PI/2; wheel.position.set(x,.5,z); wheel.castShadow=true; car.add(wheel);
}
for(const x of [-.75,.75]){
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(.45,.18,.12),mat(0xfff3b0,0x776600));
  lamp.position.set(x,.86,-2.16); car.add(lamp);
}

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);

const touchState={left:false,right:false,nitro:false,brake:false};
function bind(id,k){const el=document.getElementById(id);
 ['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();touchState[k]=true}));
 ['pointerup','pointercancel','pointerleave','touchend'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();touchState[k]=false}));
}
bind('left','left');bind('right','right');bind('nitro','nitro');bind('brake','brake');

let speed=0, steer=0, distance=0, lap=1, running=false, nitro=100, best=Number(localStorage.retroBest||0);
const lapEl=document.getElementById('lap'), speedEl=document.getElementById('speed'), msg=document.getElementById('message');

function resetGame(){
  car.position.set(0,0,65); car.rotation.y=0;
  speed=0;steer=0;distance=0;lap=1;nitro=100;
  updateHUD();
}
function updateHUD(){
  speedEl.textContent=Math.round(Math.abs(speed)*18)+' KM/H';
  lapEl.textContent='КРУГ '+lap+'/3';
}
function showMessage(t){
  msg.textContent=t;msg.style.opacity=1;
  setTimeout(()=>msg.style.opacity=0,1100);
}

function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.035,(loop.last? (t-loop.last)/1000:.016)); loop.last=t;
  if(running){
    const accel=keys.KeyW||keys.ArrowUp||keys.Space ? .055 : 0;
    const braking=keys.KeyS||keys.ArrowDown||touchState.brake;
    const turbo=keys.ShiftLeft||keys.ShiftRight||touchState.nitro;
    if(accel) speed+=accel;
    else speed-=.012;
    if(braking) speed-=.08;
    if(turbo&&nitro>0){speed+=.08;nitro-=30*dt}else nitro=Math.min(100,nitro+9*dt);
    speed=THREE.MathUtils.clamp(speed,-.7, turbo?2.25:1.55);

    const steerInput=(keys.KeyA||keys.ArrowLeft||touchState.left?-1:0)+(keys.KeyD||keys.ArrowRight||touchState.right?1:0);
    steer=THREE.MathUtils.lerp(steer,steerInput,.12);
    car.rotation.y += steer*0.032*(Math.abs(speed)+.2);
    const forward=new THREE.Vector3(0,0,-1).applyQuaternion(car.quaternion);
    car.position.addScaledVector(forward,speed);
    car.position.x=THREE.MathUtils.clamp(car.position.x,-5.7,5.7);
    car.position.z=THREE.MathUtils.clamp(car.position.z,-L/2+2,L/2-2);

    distance += Math.max(speed,0)*dt*9;
    if(distance> (L-4)*lap){
      lap++;
      if(lap<=3)showMessage('КРУГ '+lap+'!');
      else {running=false;speed=0;showMessage('ФИНИШ!');if(!best||distance<best){best=distance;localStorage.retroBest=best}}
    }
    car.position.y=0;
    car.rotation.z=THREE.MathUtils.lerp(car.rotation.z,-steer*.045,.12);

    const target=new THREE.Vector3(car.position.x*.35,5.5,car.position.z+11);
    camera.position.lerp(target,.08);
    camera.lookAt(car.position.x,1,car.position.z-5);
    updateHUD();
  }
  renderer.render(scene,camera);
}
resetGame(); requestAnimationFrame(loop);

document.getElementById('start').onclick=()=>{resetGame();running=true;document.getElementById('menu').style.display='none';showMessage('ПОЕХАЛИ!')};
document.getElementById('reset').onclick=()=>{localStorage.removeItem('retroBest');best=0;showMessage('РЕКОРД СБРОШЕН')};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
